<script id="givers-app">
'use strict';
/* GIVERS Core: データ処理はDOMから分離。金額は整数円、注文ID単位で集計。 */
const Core = (() => {
 const STATUSES={members:['有効','退会','確認待ち'],events:['受付中','終了','中止'],participations:['申込済','参加済','欠席','キャンセル']};
 const SCHEMAS={members:['会員番号','氏名','メールアドレス','入会日','会員状態','累計購入回数','累計購入金額','参加回数','備考'],events:['イベントID','BASE商品ID','イベント名','開催日時','参加費','定員','状態','申込人数','参加人数','残席数','備考'],purchases:['会員番号','イベントID','注文ID','注文日時','購入者名','合計金額','メールアドレス(請求先)','商品ID','照合状態'],participations:['会員番号','氏名','イベントID','イベント名','BASE注文ID','参加状況','備考']};
 const empty=()=>({version:1,members:[],events:[],purchases:[],participations:[],sequences:{members:0,events:0},updatedAt:null});
 const clone=s=>JSON.parse(JSON.stringify(s));
 const email=s=>String(s??'').trim().toLowerCase();
 function text(v,label,required=true){const s=String(v??'').trim();if(required&&!s)throw Error(label+'は必須です。');if(s.length>10000)throw Error(label+'が長すぎます。');return s;}
 function date(v,label,time=false){let s=text(v,label).replace(/\//g,'-').replace(' ','T');const re=time?/^(\d{4})-(\d{1,2})-(\d{1,2})T(\d{1,2}):(\d{2})(?::(\d{2}))?$/:/^(\d{4})-(\d{1,2})-(\d{1,2})$/;const m=s.match(re);if(!m)throw Error(label+'の形式が不正です。'+(time?' YYYY-MM-DD HH:mm':' YYYY-MM-DD')+' で入力してください。');const [y,mo,d,h=0,mi=0,se=0]=m.slice(1).map(v=>v===undefined?0:Number(v));const dt=new Date(y,mo-1,d,h,mi,se);if(y<1000||dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d||h>23||mi>59||se>59)throw Error(label+'が実在する日時ではありません。');return `${m[1]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`+(time?`T${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(se).padStart(2,'0')}`:'');}
 function integer(v,label){let s=text(v,label).replace(/[¥￥円\s]/g,'');if(s.includes(',')&&!/^\d{1,3}(,\d{3})+$/.test(s))throw Error(label+'の桁区切りが不正です。');s=s.replace(/,/g,'');const n=Number(s);if(!/^\d+$/.test(s)||!Number.isSafeInteger(n)||n<0)throw Error(label+'は0以上の整数で入力してください。');return n;}

 };
}

function help(){showModal('使い方・CSV仕様',`<div class="help-content"><h3>はじめに</h3><ol><li>会員台帳に会員を登録し、BASE注文の請求先と同じメールアドレスを入力します。</li><li>イベント台帳にイベントを登録し、BASE商品IDを入力します。</li><li>購入履歴でBASE注文CSVを取り込み、照合の確認事項を確認します。</li><li>参加履歴で「購入履歴から申込者を同期」を押し、当日の参加状況を更新します。</li></ol><h3>1つのCSVで一括バックアップ</h3><p><strong>一括エクスポート（CSV）</strong>で、会員・イベント・購入・参加を「種別」列で区別した1つのCSVを保存します。<strong>一括インポート（CSV）</strong>で読み込み、4種類の検証・件数確認後にまとめて保存できます。全体20MB・各種別50,000行まで。該当しない項目は空欄です。見出しとCSV形式列は変更しないでください。<br>単一CSVの採番は、現在の保存データと取り込んだIDから続けます。別ブラウザへ削除済み番号の採番履歴も移す場合はZIP方式を使用してください。</p><h3>ZIPによる一括バックアップ・復元</h3><p>各画面上部の<strong>一括エクスポート（ZIP）</strong>で、4種類のCSVをまとめて保存できます。<strong>一括インポート（ZIP）</strong>でZIPを1回選択すると、4種類をすべて検証し、件数を確認してから一度に保存します。エラーがあればどの台帳も変更しません。<br>ZIPには members.csv、events.csv、purchases.csv、participations.csv と、自動採番を維持する backup-info.json が含まれます。0件の台帳も必要です。ファイル名や採番情報は変更しないでください。<br>個別CSVの入出力も引き続き使用できます。</p><p style="margin-top:8px">会員・イベント・参加履歴は同じIDを更新、購入履歴は同じ注文IDをスキップします。CSVにない既存データは削除しません。ExcelでCSVを開く際はID列を文字列として取り込み、先頭の0や長い注文IDを保持してください。</p><h3>BASE CSVの必要な列</h3><p><code>注文ID</code> <code>注文日時</code> <code>氏(請求先)</code> <code>名(請求先)</code> <code>合計金額</code> <code>メールアドレス(請求先)</code> <code>商品ID</code></p><p style="margin-top:8px">同じ注文IDの複数明細は1注文にまとめ、合計金額を1回だけ加算します。同じ注文の合計金額・日時・購入者が異なる場合は全体の取り込みを停止します。列名は上記と一致させてください。</p><h3>自動照合と集計のルール</h3><ul><li>メールは前後の空白と大文字・小文字を除いて比較します。メールアドレスとBASE商品IDはそれぞれ台帳内で重複登録できません。</li><li>イベントに該当しない商品は通常購入として集計します。1注文が複数イベントに該当すると「要確認」となり、新規の参加同期対象から除外します。</li><li>参加履歴は1注文につき1件です。数量による複数人参加には対応していません。</li><li>申込人数はキャンセル・欠席を含む全参加履歴の件数です。残席数は定員から申込人数を引きます。参加人数・参加回数は「参加済」のみです。</li><li>売上は取り込んだ全注文の合計金額です。返金・注文キャンセルによる売上の減算は行いません。</li><li>会員・イベントを削除しても関連履歴は残ります。イベント情報の変更で既存注文の紐付けが変わった場合、参加状況は保持して関連情報を再照合します。</li></ul><h3>保存について</h3><p>データはこのブラウザのLocal Storageに保存します。ブラウザ・プロファイル・ファイルの場所が変わると同じデータを参照できない場合があります。このHTMLは同じ場所で使用し、定期的に一括CSVまたはZIPを保存してください。プライベートブラウズや閲覧データの削除では保存内容が失われることがあります。</p><h3>ファイル形式</h3><p>UTF-8（BOM付き）で出力し、UTF-8 / Shift_JISで取り込めます。カンマ・引用符・備考の改行を保持します。出力の<code>CSV形式</code>列と購入履歴の<code>商品ID</code>列は復元に使うため変更しないでください。表計算ソフトの数式として解釈される文字列には保護用のアポストロフィを付与し、再取り込み時に元に戻します。</p></div>`,`<button class="btn primary" data-action="close">閉じる</button>`);}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-page]');if(!target)return;if(target.dataset.page){go(target.dataset.page);return;}const a=target.dataset.action,id=target.dataset.id;if(a==='bulk-csv-export')exportUnifiedCSV();else if(a==='bulk-csv-import')backupImportModal('csv');else if(a==='bulk-export')exportBackup();else if(a==='bulk-import')backupImportModal();else if(a==='close')closeModal();else if(a==='help')help();else if(a==='add-member')editModal('members');else if(a==='add-event')editModal('events');else if(a==='add')editModal(page);else if(a==='edit')editModal(page,id);else if(a==='delete')deleteModal(id);else if(a==='export'){download(`GIVERS_${page}_${today()}.csv`,Core.exportCSV(state,page));notify('全'+state[page].length+'件をCSVでエクスポートしました。');}else if(a==='template')template(page);else if(a==='import')importModal();else if(a==='sync'){const next=Core.clone(state);Core.reconcile(next);const n=Core.sync(next);if(!n){notify('新しく同期できる注文はありません。イベントのBASE商品IDと購入履歴をご確認ください。');return;}if(commit(next)){render();notify(n+'件の申込者を同期しました。');}}else if(a==='prev'||a==='next'){pageIndex+=a==='prev'?-1:1;renderTable();}else if(a==='raw-backup')download('GIVERS_保存データ退避.txt',rawSnapshot||'保存データなし','text/plain;charset=utf-8');});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){query=el.value;pageIndex=0;renderTable();}else if(el.dataset.order&&el.dataset.field==='notes'){const next=Core.clone(state),row=next.participations.find(a=>a.orderId===el.dataset.order);if(row){row.notes=el.value;if(!commit(next))renderTable();}}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='status-filter'){filter=el.value;pageIndex=0;renderTable();}else if(el.id==='event-filter'){eventFilter=el.value;pageIndex=0;renderTable();}else if(el.dataset.order){const next=Core.clone(state),a=next.participations.find(a=>a.orderId===el.dataset.order);if(a){a[el.dataset.field]=el.value;if(commit(next)){if(el.dataset.field==='status')renderTable();notify('参加履歴を保存しました。');}else renderTable();}}});
$('#modal').addEventListener('cancel',()=>{importGeneration++;importPlan=null;});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){notify('別の画面で保存データが変更されました。再読み込みして最新の内容を表示してください。',true);$('#saved-state').textContent='再読み込みが必要です';}});
for(const el of document.querySelectorAll('[data-icon]'))el.innerHTML=icon(el.dataset.icon);
render();
</script>
